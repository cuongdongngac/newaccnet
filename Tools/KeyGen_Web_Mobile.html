<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEWACCNET - Sinh Số Đăng Ký Bản Quyền</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: #f1f5f9; padding: 20px 12px; display: flex; justify-content: center; }
        .card { background: #fff; width: 100%; max-width: 520px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); overflow: hidden; }
        .header { background: #1e3a8a; color: #fff; padding: 20px 16px; text-align: center; }
        .header h1 { font-size: 19px; font-weight: bold; letter-spacing: 0.5px; }
        .header p { font-size: 12px; color: #93c5fd; margin-top: 4px; }
        .body { padding: 20px 16px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #1e293b; margin-bottom: 6px; }
        .radio-group { display: flex; gap: 16px; margin-bottom: 12px; }
        .radio-group label { font-weight: 500; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .input-row { display: flex; gap: 8px; }
        input[type="text"] { flex: 1; height: 38px; border: 1.5px solid #cbd5e1; border-radius: 6px; padding: 0 10px; font-size: 14px; font-weight: 600; color: #0f172a; }
        input[type="text"]:focus { outline: none; border-color: #2563eb; }
        button { cursor: pointer; border: none; border-radius: 6px; font-weight: 600; transition: background 0.15s; }
        .btn-paste { background: #e2e8f0; color: #334155; padding: 0 12px; font-size: 13px; }
        .btn-paste:hover { background: #cbd5e1; }
        .btn-primary { width: 100%; height: 42px; background: #2563eb; color: #fff; font-size: 14px; margin-top: 6px; }
        .btn-primary:hover { background: #1d4ed8; }
        .result-box { margin-top: 18px; padding-top: 16px; border-top: 1px dashed #cbd5e1; }
        .result-input { background: #ecfdf5 !important; border-color: #10b981 !important; color: #065f46 !important; font-size: 16px !important; letter-spacing: 1px; }
        .btn-copy { background: #059669; color: #fff; padding: 0 14px; font-size: 13px; }
        .btn-copy:hover { background: #047857; }
        .footer { background: #f8fafc; border-top: 1px solid #e2e8f0; padding: 12px; text-align: center; font-size: 11px; color: #64748b; }
        .summary { font-size: 11.5px; color: #059669; margin-top: 6px; font-style: italic; min-height: 18px; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1>NEWACCNET KEY GENERATOR</h1>
        <p>Tạo Số đăng ký bản quyền • Tác giả: Phạm Việt Cường</p>
    </div>

    <div class="body">
        <div class="form-group">
            <label>1. Hình thức cấp phép bản quyền:</label>
            <div style="background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 6px; padding: 10px 12px; font-weight: 600; font-size: 13px; color: #1e40af;">
                💻 Cấp phép theo từng Máy tính (Hardware ID) - Chống chia sẻ bản quyền
            </div>
        </div>

        <div class="form-group">
            <label id="lblTarget">2. Nhập Mã máy tính của khách hàng (Zalo):</label>
            <div class="input-row">
                <input type="text" id="txtTargetId" placeholder="Ví dụ: NAC-8F2A-9C01-7D4E">
                <button class="btn-paste" onclick="pasteClipboard()">Dán</button>
            </div>
        </div>

        <div class="form-group">
            <label>3. Thời hạn cấp phép:</label>
            <div class="radio-group" style="flex-wrap: wrap; gap: 12px;">
                <label><input type="radio" name="expOption" value="20991231" checked> Vĩnh viễn (2099)</label>
                <label><input type="radio" name="expOption" value="1y"> 1 Năm</label>
                <label><input type="radio" name="expOption" value="2y"> 2 Năm</label>
                <label><input type="radio" name="expOption" value="3y"> 3 Năm</label>
            </div>
        </div>

        <button class="btn-primary" onclick="generateCode()">⚡ TẠO SỐ ĐĂNG KÝ (12 KÝ TỰ)</button>

        <div class="result-box">
            <label>4. Số đăng ký tạo ra (Gửi lại khách hàng):</label>
            <div class="input-row">
                <input type="text" id="txtResult" class="result-input" readonly placeholder="XXXX-XXXX-XXXX">
                <button class="btn-copy" onclick="copyResult()">Sao chép</button>
            </div>
            <div class="summary" id="lblSummary"></div>
        </div>
    </div>

    <div class="footer">
        Đồng bộ 100% với hàm REG70 &amp; DbConfigService của NewaccNet
    </div>
</div>

<script>
const SECRET_SALT = "PVCUONG#NEWACC70@2026$KEY";

// MD5 chuẩn (từ gencode.txt)
function md5(string) {
    function rotateLeft(lValue, iShiftBits) {
        return (lValue << iShiftBits) | (lValue >>> (32 - iShiftBits));
    }
    function addUnsigned(lX, lY) {
        var lX4, lY4, lX8, lY8, lResult;
        lX8 = (lX & 0x80000000);
        lY8 = (lY & 0x80000000);
        lX4 = (lX & 0x40000000);
        lY4 = (lY & 0x40000000);
        lResult = (lX & 0x3FFFFFFF) + (lY & 0x3FFFFFFF);
        if (lX4 & lY4) return (lResult ^ 0x80000000 ^ lX8 ^ lY8);
        if (lX4 | lY4) {
            if (lResult & 0x40000000) return (lResult ^ 0xC0000000 ^ lX8 ^ lY8);
            else return (lResult ^ 0x40000000 ^ lX8 ^ lY8);
        } else return (lResult ^ lX8 ^ lY8);
    }
    function F(x, y, z) { return (x & y) | ((~x) & z); }
    function G(x, y, z) { return (x & z) | (y & (~z)); }
    function H(x, y, z) { return (x ^ y ^ z); }
    function I(x, y, z) { return (y ^ (x | (~z))); }

    function FF(a, b, c, d, x, s, ac) {
        a = addUnsigned(a, addUnsigned(addUnsigned(F(b, c, d), x), ac));
        return addUnsigned(rotateLeft(a, s), b);
    }
    function GG(a, b, c, d, x, s, ac) {
        a = addUnsigned(a, addUnsigned(addUnsigned(G(b, c, d), x), ac));
        return addUnsigned(rotateLeft(a, s), b);
    }
    function HH(a, b, c, d, x, s, ac) {
        a = addUnsigned(a, addUnsigned(addUnsigned(H(b, c, d), x), ac));
        return addUnsigned(rotateLeft(a, s), b);
    }
    function II(a, b, c, d, x, s, ac) {
        a = addUnsigned(a, addUnsigned(addUnsigned(I(b, c, d), x), ac));
        return addUnsigned(rotateLeft(a, s), b);
    }

    function convertToWordArray(string) {
        var lWordCount;
        var lMessageLength = string.length;
        var lNumberOfWords_temp1 = lMessageLength + 8;
        var lNumberOfWords_temp2 = (lNumberOfWords_temp1 - (lNumberOfWords_temp1 % 64)) / 64;
        var lNumberOfWords = (lNumberOfWords_temp2 + 1) * 16;
        var lWordArray = Array(lNumberOfWords - 1);
        var lBytePosition = 0;
        var lByteCount = 0;
        while (lByteCount < lMessageLength) {
            lWordCount = (lByteCount - (lByteCount % 4)) / 4;
            lBytePosition = (lByteCount % 4) * 8;
            lWordArray[lWordCount] = (lWordArray[lWordCount] | (string.charCodeAt(lByteCount) << lBytePosition));
            lByteCount++;
        }
        lWordCount = (lByteCount - (lByteCount % 4)) / 4;
        lBytePosition = (lByteCount % 4) * 8;
        lWordArray[lWordCount] = lWordArray[lWordCount] | (0x80 << lBytePosition);
        lWordArray[lNumberOfWords - 2] = lMessageLength << 3;
        lWordArray[lNumberOfWords - 1] = lMessageLength >>> 29;
        return lWordArray;
    }

    function wordToHex(lValue) {
        var WordToHexValue = "", WordToHexValue_temp = "", lByte, lCount;
        for (lCount = 0; lCount <= 3; lCount++) {
            lByte = (lValue >>> (lCount * 8)) & 255;
            WordToHexValue_temp = "0" + lByte.toString(16);
            WordToHexValue = WordToHexValue + WordToHexValue_temp.substr(WordToHexValue_temp.length - 2, 2);
        }
        return WordToHexValue;
    }

    var x = convertToWordArray(string);
    var a = 0x67452301, b = 0xEFCDAB89, c = 0x98BADCFE, d = 0x10325476;
    var S11=7, S12=12, S13=17, S14=22;
    var S21=5, S22=9, S23=14, S24=20;
    var S31=4, S32=11, S33=16, S34=23;
    var S41=6, S42=10, S43=15, S44=21;

    for (var k = 0; k < x.length; k += 16) {
        var AA = a, BB = b, CC = c, DD = d;
        a = FF(a,b,c,d,x[k+0], S11,0xD76AA478); d = FF(d,a,b,c,x[k+1], S12,0xE8C7B756); c = FF(c,d,a,b,x[k+2], S13,0x242070DB); b = FF(b,c,d,a,x[k+3], S14,0xC1BDCEEE);
        a = FF(a,b,c,d,x[k+4], S11,0xF57C0FAF); d = FF(d,a,b,c,x[k+5], S12,0x4787C62A); c = FF(c,d,a,b,x[k+6], S13,0xA8304613); b = FF(b,c,d,a,x[k+7], S14,0xFD469501);
        a = FF(a,b,c,d,x[k+8], S11,0x698098D8); d = FF(d,a,b,c,x[k+9], S12,0x8B44F7AF); c = FF(c,d,a,b,x[k+10],S13,0xFFFF5BB1); b = FF(b,c,d,a,x[k+11],S14,0x895CD7BE);
        a = FF(a,b,c,d,x[k+12],S11,0x6B901122); d = FF(d,a,b,c,x[k+13],S12,0xFD987193); c = FF(c,d,a,b,x[k+14],S13,0xA679438E); b = FF(b,c,d,a,x[k+15],S14,0x49B40821);

        a = GG(a,b,c,d,x[k+1], S21,0xF61E2562); d = GG(d,a,b,c,x[k+6], S22,0xC040B340); c = GG(c,d,a,b,x[k+11],S23,0x265E5A51); b = GG(b,c,d,a,x[k+0], S24,0xE9B6C7AA);
        a = GG(a,b,c,d,x[k+5], S21,0xD62F105D); d = GG(d,a,b,c,x[k+10],S22,0x02441453); c = GG(c,d,a,b,x[k+15],S23,0xD8A1E681); b = GG(b,c,d,a,x[k+4], S24,0xE7D3FBC8);
        a = GG(a,b,c,d,x[k+9], S21,0x21E1CDE6); d = GG(d,a,b,c,x[k+14],S22,0xC33707D6); c = GG(c,d,a,b,x[k+3], S23,0xF4D50D87); b = GG(b,c,d,a,x[k+8], S24,0x455A14ED);
        a = GG(a,b,c,d,x[k+13],S21,0xA9E3E905); d = GG(d,a,b,c,x[k+2], S22,0xFCEFA3F8); c = GG(c,d,a,b,x[k+7], S23,0x676F02D9); b = GG(b,c,d,a,x[k+12],S24,0x8D2A4C8A);

        a = HH(a,b,c,d,x[k+5], S31,0xFFFA3942); d = HH(d,a,b,c,x[k+8], S32,0x8771F681); c = HH(c,d,a,b,x[k+11],S33,0x6D9D6122); b = HH(b,c,d,a,x[k+14],S34,0xFDE5380C);
        a = HH(a,b,c,d,x[k+1], S31,0xA4BEEA44); d = HH(d,a,b,c,x[k+4], S32,0x4BDECFA9); c = HH(c,d,a,b,x[k+7], S33,0xF6BB4B60); b = HH(b,c,d,a,x[k+10],S34,0xBEBFBC70);
        a = HH(a,b,c,d,x[k+13],S31,0x289B7EC6); d = HH(d,a,b,c,x[k+0], S32,0xEAA127FA); c = HH(c,d,a,b,x[k+3], S33,0xD4EF3085); b = HH(b,c,d,a,x[k+6], S34,0x04881D05);
        a = HH(a,b,c,d,x[k+9], S31,0xD9D4D039); d = HH(d,a,b,c,x[k+12],S32,0xE6DB99E5); c = HH(c,d,a,b,x[k+15],S33,0x1FA27CF8); b = HH(b,c,d,a,x[k+2], S34,0xC4AC5665);

        a = II(a,b,c,d,x[k+0], S41,0xF4292244); d = II(d,a,b,c,x[k+7], S42,0x432AFF97); c = II(c,d,a,b,x[k+14],S43,0xAB9423A7); b = II(b,c,d,a,x[k+5], S44,0xFC93A039);
        a = II(a,b,c,d,x[k+12],S41,0x655B59C3); d = II(d,a,b,c,x[k+3], S42,0x8F0CCC92); c = II(c,d,a,b,x[k+10],S43,0xFFEFF47D); b = II(b,c,d,a,x[k+1], S44,0x85845DD1);
        a = II(a,b,c,d,x[k+8], S41,0x6FA87E4F); d = II(d,a,b,c,x[k+15],S42,0xFE2CE6E0); c = II(c,d,a,b,x[k+6], S43,0xA3014314); b = II(b,c,d,a,x[k+13],S44,0x4E0811A1);
        a = II(a,b,c,d,x[k+4], S41,0xF7537E82); d = II(d,a,b,c,x[k+11],S42,0xBD3AF235); c = II(c,d,a,b,x[k+2], S43,0x2AD7D2BB); b = II(b,c,d,a,x[k+9], S44,0xEB86D391);

        a = addUnsigned(a, AA); b = addUnsigned(b, BB); c = addUnsigned(c, CC); d = addUnsigned(d, DD);
    }
    return (wordToHex(a) + wordToHex(b) + wordToHex(c) + wordToHex(d)).toLowerCase();
}

function onTypeChange() {
    var isCompany = document.querySelector('input[name="licType"]:checked').value === "tax";
    document.getElementById("lblTarget").innerText = isCompany 
        ? "2. Nhập Mã số thuế của doanh nghiệp (ví dụ: 010100101):" 
        : "2. Nhập Mã máy tính của khách hàng (Zalo):";
    document.getElementById("txtTargetId").placeholder = isCompany ? "Ví dụ: 010100101" : "Ví dụ: NAC-8F2A-9C01-7D4E";
}

function pasteClipboard() {
    navigator.clipboard.readText().then(text => {
        if (text) document.getElementById("txtTargetId").value = text.trim();
    }).catch(() => {
        alert("Trình duyệt chặn quyền truy cập Clipboard. Bạn hãy dán (Ctrl+V) trực tiếp vào ô nhé.");
    });
}

function generateCode() {
    var targetId = document.getElementById("txtTargetId").value.trim().toUpperCase();
    if (!targetId) {
        alert("Vui lòng nhập Mã máy hoặc Mã số thuế!");
        return;
    }

    var expOpt = document.querySelector('input[name="expOption"]:checked').value;
    var expStr = "20991231";
    var desc = "Vĩnh viễn / Dài hạn";

    var now = new Date();
    if (expOpt === "1y") {
        now.setFullYear(now.getFullYear() + 1);
        expStr = now.toISOString().slice(0, 10).replace(/-/g, "");
        desc = "1 Năm (Hết hạn: " + expStr.substr(6,2) + "/" + expStr.substr(4,2) + "/" + expStr.substr(0,4) + ")";
    } else if (expOpt === "2y") {
        now.setFullYear(now.getFullYear() + 2);
        expStr = now.toISOString().slice(0, 10).replace(/-/g, "");
        desc = "2 Năm (Hết hạn: " + expStr.substr(6,2) + "/" + expStr.substr(4,2) + "/" + expStr.substr(0,4) + ")";
    } else if (expOpt === "3y") {
        now.setFullYear(now.getFullYear() + 3);
        expStr = now.toISOString().slice(0, 10).replace(/-/g, "");
        desc = "3 Năm (Hết hạn: " + expStr.substr(6,2) + "/" + expStr.substr(4,2) + "/" + expStr.substr(0,4) + ")";
    }

    const DATE_MASK = 0x7A6C;
    function encodeDate(expiryDate) {
        var s = String(expiryDate || "").replace(/[^0-9]/g, "");
        if (s.length !== 8) s = "20991231";
        var y = parseInt(s.substring(0, 4), 10) - 2020;
        var m = parseInt(s.substring(4, 6), 10);
        var d = parseInt(s.substring(6, 8), 10);
        var val = ((y & 0x7F) << 9) | ((m & 0x0F) << 5) | (d & 0x1F);
        var masked = (val ^ DATE_MASK) & 0xFFFF;
        var hex = masked.toString(16).toUpperCase();
        while (hex.length < 4) hex = "0" + hex;
        return hex;
    }

    var dateHex = encodeDate(expStr);
    var raw = targetId + "#" + expStr + "#" + SECRET_SALT;
    var hex = md5(raw).toUpperCase();

    var p1 = hex.substring(0, 4);
    var p2 = hex.substring(8, 12);

    var code = dateHex + "-" + p1 + "-" + p2;
    document.getElementById("txtResult").value = code;
    document.getElementById("lblSummary").innerText = "✔ Đã tạo Số đăng ký [" + code + "] • Gói: " + desc;
}

function copyResult() {
    var val = document.getElementById("txtResult").value;
    if (!val) {
        alert("Chưa có Số đăng ký để sao chép!");
        return;
    }
    navigator.clipboard.writeText(val).then(() => {
        alert("Đã sao chép Số đăng ký vào bộ nhớ tạm:\n\n" + val + "\n\nBạn có thể dán (Paste) gửi Zalo cho khách hàng ngay.");
    });
}
</script>
